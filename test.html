<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>校舎内 WebAR 学科紹介</title>

    <!-- A-Frame と MindAR の読み込み -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.2/dist/mindar-image-aframe.prod.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v6.1.1/dist/aframe-extras.min.js"></script>

    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; }
        
        /* 戻るボタン */
        .btn-back {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 10000;
            background-color: rgba(0, 0, 0, 0.6);
            color: #ffffff;
            padding: 10px 18px;
            border-radius: 20px;
            text-decoration: none;
            font-weight: bold;
            font-size: 16px;
            border: 2px solid #ffffff;
        }

        /* 階層切り替えUI（画面上部に配置） */
        .floor-selector {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 10000;
            display: flex;
            gap: 6px;
            background: rgba(0, 0, 0, 0.6);
            padding: 6px;
            border-radius: 20px;
            border: 2px solid #ffffff;
        }

        .floor-btn {
            background: transparent;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
        }

        .floor-btn.active {
            background: #10b981; /* 選択中の階 */
            color: white;
        }

        .mindar-ui-overlay, .mindar-ui-scanning {
            display: none !important;
        }

        /* 検出枠アニメーション */
        .scan-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            z-index: 10000;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .scan-overlay.active { opacity: 1; }

        .corner {
            position: absolute;
            width: 60px; height: 60px;
            border-color: #10b981;
            border-style: solid;
            transition: transform 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.27);
        }

        .corner-top-left {
            top: 50%; left: 50%;
            border-width: 6px 0 0 6px;
            border-top-left-radius: 16px;
            transform: translate(-50vw, -50vh);
        }
        
        .corner-top-right {
            top: 50%; left: 50%;
            border-width: 6px 6px 0 0;
            border-top-right-radius: 16px;
            transform: translate(calc(50vw - 60px), -50vh);
        }

        .corner-bottom-left {
            top: 50%; left: 50%;
            border-width: 0 0 6px 6px;
            border-bottom-left-radius: 16px;
            transform: translate(-50vw, calc(50vh - 60px));
        }

        .corner-bottom-right {
            top: 50%; left: 50%;
            border-width: 0 6px 6px 0;
            border-bottom-right-radius: 16px;
            transform: translate(calc(50vw - 60px), calc(50vh - 60px));
        }

        .scan-overlay.active .corner-top-left { transform: translate(-120px, -120px); }
        .scan-overlay.active .corner-top-right { transform: translate(60px, -120px); }
        .scan-overlay.active .corner-bottom-left { transform: translate(-120px, 60px); }
        .scan-overlay.active .corner-bottom-right { transform: translate(60px, 60px); }

        .scan-message {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, 140px);
            background: rgba(16, 185, 129, 0.95);
            color: #ffffff;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 16px;
            white-space: nowrap;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            border: 2px solid #ffffff;
        }

        /* スタンプポップアップ */
        .stamp-dialog-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: 100vh;
            background: rgba(0, 0, 0, 0.7);
            z-index: 20000;
            display: none;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(5px);
        }

        .stamp-dialog-box {
            background: #ffffff;
            width: 85%; max-width: 340px;
            border-radius: 20px;
            padding: 24px 20px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.27);
        }

        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body>

    <a href="index.html" class="btn-back">← 戻る</a>

    <!-- 階層切り替えUI -->
    <div class="floor-selector">
        <button class="floor-btn active" onclick="switchFloor('1f', 'kougyo2.glb', this)">1F</button>
        <button class="floor-btn" onclick="switchFloor('2f', 'syokutyou.glb', this)">2F</button>
        <button class="floor-btn" onclick="switchFloor('3f', 'syougyou3.glb', this)">3F</button>
        <button class="floor-btn" onclick="switchFloor('4f', 'hukude.glb', this)">4F</button>
        <button class="floor-btn" onclick="switchFloor('5f', 'kougyo2.glb', this)">5F</button>
    </div>

    <!-- 検出アニメーションUI -->
    <div id="scan-overlay" class="scan-overlay">
        <div class="corner corner-top-left"></div>
        <div class="corner corner-top-right"></div>
        <div class="corner corner-bottom-left"></div>
        <div class="corner corner-bottom-right"></div>
        <div id="scan-text" class="scan-message">🔍 1F ターゲット検出！</div>
    </div>

    <!-- 最初は 1f.mind を読み込む -->
    <a-scene 
        id="ar-scene"
        mindar-image="imageTargetSrc: ./1f.mind; autoStart: true; uiLoading: no; uiError: no;" 
        color-space="sRGB" 
        renderer="colorManagement: true, physicallyCorrectLights" 
        vr-mode-ui="enabled: false">
      
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- 動的にモデルとターゲットを切り替える単一エンティティ -->
        <a-entity mindar-image-target="targetIndex: 0" id="target-object">
            <a-entity id="ar-model" gltf-model="kougyo2.glb" position="0 0 0" scale="0.1 0.1 0.1" animation-mixer></a-entity>
        </a-entity>

    </a-scene>

    <!-- スタンプ獲得ポップアップ -->
    <div id="stamp-dialog" class="stamp-dialog-overlay">
        <div class="stamp-dialog-box">
            <h3 style="margin-top: 0; color: #059669; font-size: 20px;">🎉 スタンプ獲得！</h3>
            <p id="stamp-msg" style="font-size: 14px; color: #444; line-height: 1.6; margin-bottom: 20px;">
                オブジェクトを検出して<br>キャラクターが出現しました！
            </p>
            <div style="display: flex; gap: 10px;">
                <button onclick="closeStampDialog()" style="flex: 1; padding: 10px; border: none; background: #94a3b8; color: white; border-radius: 10px; font-weight: bold; cursor: pointer;">閉じる</button>
                <button onclick="goToMap()" style="flex: 1; padding: 10px; border: none; background: #f59e0b; color: white; border-radius: 10px; font-weight: bold; cursor: pointer;">マップへGO!</button>
            </div>
        </div>
    </div>

    <script>
        let currentFloor = '1F';

        window.addEventListener('DOMContentLoaded', () => {
            setupTargetEvents();
        });

        function setupTargetEvents() {
            const scanOverlay = document.getElementById('scan-overlay');
            const targetObject = document.getElementById('target-object');
            const stampDialog = document.getElementById('stamp-dialog');
            const stampMsg = document.getElementById('stamp-msg');

            if (targetObject) {
                targetObject.addEventListener('targetFound', () => {
                    document.getElementById('scan-text').textContent = `🔍 ${currentFloor} ターゲット検出！`;
                    scanOverlay.classList.add('active');

                    localStorage.setItem(`stamp-${currentFloor}-done`, '1');

                    setTimeout(() => {
                        stampMsg.innerHTML = `${currentFloor} のオブジェクトを検出して<br>キャラクターが出現しました！<br>マップを開いて確認しますか？`;
                        stampDialog.style.display = 'flex';
                    }, 3000);
                });

                targetObject.addEventListener('targetLost', () => {
                    scanOverlay.classList.remove('active');
                });
            }
        }

        // ボタンで .mind ファイルと 3Dモデル を動的に切り替える関数
        function switchFloor(floorPrefix, modelName, btnElement) {
            currentFloor = floorPrefix.toUpperCase();

            // 1. ボタンのアクティブ状態更新
            document.querySelectorAll('.floor-btn').forEach(btn => btn.classList.remove('active'));
            btnElement.classList.add('active');

            // 2. モデルの書き換え
            const arModel = document.getElementById('ar-model');
            arModel.setAttribute('gltf-model', modelName);

            // 3. MindAR システムを取得して新しい .mind ファイルを再ロード
            const sceneEl = document.getElementById('ar-scene');
            const arSystem = sceneEl.systems["mindar-image-system"];
            
            if (arSystem) {
                arSystem.stop();
                sceneEl.setAttribute('mindar-image', `imageTargetSrc: ./${floorPrefix}.mind; autoStart: true; uiLoading: no; uiError: no;`);
                arSystem.start();
            }
        }

        function closeStampDialog() {
            document.getElementById('stamp-dialog').style.display = 'none';
        }

        function goToMap() {
            window.location.href = 'map.html';
        }
    </script>
</body>
</html>
